baseURL: "https://fam-lab.github.io/" 
title: FAMLAB
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

taxonomies:
    tag: tags

menu:
    main:
        - name: Research
          url: research/
          weight: 1 
        - name: Papers
          url: papers/
          weight: 2
        - name: Presentations
          url: presentations/
          weight: 3
        - name: SPARK
          url: https://www.sparksociety.org/
          weight: 4

params:
    description: "This is the official website of the FAM lab, led by Tori Peña."
    author: Tori Peña, Ph.D.
    # googleAnalyticsID: "G-XXXXX"
    #DateFormat: 
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: ["research","papers","presentations", "Prospective Graduate Student Information", "SPARK"]
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: Future and Memory (FaM) Lab @ Stony Brook University
          subtitle: "We examine how memories and ideas about the future are socially constructed. The FaM lab aims to inform both theoretical and applied theories about human cognition. We address a variety of questions such as how does remembering with others change the way people remember the past? How does imagining the future with others shift the emotional valence for people's personal and collective futures? \\ Dr. Tori Peña is the director of the FaM lab."
          imageUrl: "famlablogo.jpeg" 
          imageWidth: 220
          imageHeight: 220
          buttons:
            - name: Research
              url: research/
            - name: Papers
              url: papers/
            - name: Presentations
              url: presentations/
            - name: Prospective Graduate Student Information
              url: https://docs.google.com/document/d/1DrpSp4YVF35GKssdxrJZh-fipUKtW0nMV-X3wU8VRCU/edit?usp=sharing 
            - name: SPARK
              url: https://www.sparksociety.org/

    socialIcons:
        - name: CV
          url: Peña_CV.pdf
        - name: Email
          url: mailto:Tori.Pena@stonybrook.edu
        - name: Google Scholar
          url: https://scholar.google.com/citations?user=gun9xpkAAAAJ&hl=en
        - name: GitHub
          url: https://github.com/ptori 
          #to be updated

    assets:
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: "FAM Lab"
      icon: famlablogo.jpeg
      iconHeight: 20

markup:
